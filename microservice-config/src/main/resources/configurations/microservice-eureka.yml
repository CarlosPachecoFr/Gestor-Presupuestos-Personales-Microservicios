server:
  port: 8761
 
eureka:
  instance:
    hostname: microservice-eureka  #Este es el host del servidor
  client:
    register-with-eureka: false  #esto es para que no se registre en eureka a si mismo
    fetch-registry: false
    server-url: 
      defaultZone: http://microservice-eureka:8761/eureka/